<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 282" width="1000" height="282" role="img" aria-labelledby="t d"><title id="t">The four gates a series must pass</title><desc id="d">Size, reasons, tests and comments. All four pass: ready for review. Any fails: back to the rewrite, or a written reason the reviewer sees.</desc><style>
.bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.io{fill:#ddf4ff;stroke:#54aeff}.gate{fill:#fff8c5;stroke:#d4a72c}
.ok{fill:#dafbe1;stroke:#4ac26b}.bad{fill:#ffebe9;stroke:#ff8182}.frame{fill:none;stroke:#8c959f;stroke-dasharray:5 4}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}.b{font-size:12px;fill:#424a53}.m{font-size:12px;fill:#59636e}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.k{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#59636e}
.ln{fill:none;stroke:#57606a;stroke-width:1.6}.dash{stroke-dasharray:5 4}.ah{fill:#57606a}.lnok{fill:none;stroke:#2da44e;stroke-width:2.2}.ahok{fill:#2da44e}
.dot{fill:#57606a}.dotok{fill:#2da44e}.lane{stroke:#d0d7de;stroke-width:2}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.io{fill:#0c2d6b;stroke:#1f6feb}
.gate{fill:#3b2300;stroke:#9e6a03}.ok{fill:#04260f;stroke:#2ea043}.bad{fill:#3c1013;stroke:#da3633}.frame{stroke:#6e7681}
text{fill:#e6edf3}.b{fill:#c9d1d9}.m,.k{fill:#9198a1}.ln{stroke:#8b949e}.ah,.dot{fill:#8b949e}.lane{stroke:#30363d}
.lnok{stroke:#3fb950}.ahok,.dotok{fill:#3fb950}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahok" d="M0,0L10,5L0,10z"/></marker></defs><rect class="bg" width="1000" height="282" rx="12"/><text class="k" x="30" y="28" text-anchor="start">THE BUILDER'S FOUR GATES</text><rect class="frame" x="246" y="34" width="524" height="222" rx="14"/><rect class="io" x="30" y="106" width="176" height="80" rx="10"/><text class="t" x="44" y="132">The rebuilt series</text><text class="b" x="44" y="154">built beside your branch,</text><text class="b" x="44" y="171">checked at every commit</text><rect class="gate" x="262" y="42" width="236" height="92" rx="10"/><text class="t" x="276" y="68">Size</text><text class="b" x="276" y="90">keeps at most half of the</text><text class="b" x="276" y="107">branch's reviewable lines</text><rect class="gate" x="518" y="42" width="236" height="92" rx="10"/><text class="t" x="532" y="68">Reasons</text><text class="b" x="532" y="90">every function added, dropped</text><text class="b" x="532" y="107">or rewritten has a written why</text><rect class="gate" x="262" y="152" width="236" height="92" rx="10"/><text class="t" x="276" y="178">Tests</text><text class="b" x="276" y="200">none fails or goes missing</text><text class="b" x="276" y="217">silently; must-pass cannot fail</text><rect class="gate" x="518" y="152" width="236" height="92" rx="10"/><text class="t" x="532" y="178">Comments</text><text class="b" x="532" y="200">at most a quarter prose; short</text><text class="b" x="532" y="217">docstrings and commit messages</text><path class="ln" d="M208,146 H242" marker-end="url(#a)"/><rect class="ok" x="836" y="52" width="150" height="84" rx="10"/><text class="t" x="850" y="78">Ready for review</text><text class="b" x="850" y="100">the maintainer pass</text><text class="b" x="850" y="117">reads it next</text><rect class="bad" x="836" y="166" width="150" height="84" rx="10"/><text class="t" x="850" y="192">Back to rewrite</text><text class="b" x="850" y="214">or a written reason</text><text class="b" x="850" y="231">the reviewer will see</text><path class="ln" d="M772,94 H832" marker-end="url(#a)"/><text class="m" x="803" y="84" text-anchor="middle">all pass</text><path class="ln dash" d="M772,208 H832" marker-end="url(#a)"/><text class="m" x="803" y="198" text-anchor="middle">any fails</text></svg>
