<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 322" width="1000" height="322" role="img" aria-labelledby="t d"><title id="t">How review-ready keeps your branch safe</title><desc id="d">The pass saves a copy of your branch, builds the series in a private worktree, and moves your branch only on --land after the review; one command undoes it.</desc><style>
.bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.io{fill:#ddf4ff;stroke:#54aeff}.gate{fill:#fff8c5;stroke:#d4a72c}
.ok{fill:#dafbe1;stroke:#4ac26b}.bad{fill:#ffebe9;stroke:#ff8182}.frame{fill:none;stroke:#8c959f;stroke-dasharray:5 4}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}.b{font-size:12px;fill:#424a53}.m{font-size:12px;fill:#59636e}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.k{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#59636e}
.ln{fill:none;stroke:#57606a;stroke-width:1.6}.dash{stroke-dasharray:5 4}.ah{fill:#57606a}.lnok{fill:none;stroke:#2da44e;stroke-width:2.2}.ahok{fill:#2da44e}
.dot{fill:#57606a}.dotok{fill:#2da44e}.lane{stroke:#d0d7de;stroke-width:2}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.io{fill:#0c2d6b;stroke:#1f6feb}
.gate{fill:#3b2300;stroke:#9e6a03}.ok{fill:#04260f;stroke:#2ea043}.bad{fill:#3c1013;stroke:#da3633}.frame{stroke:#6e7681}
text{fill:#e6edf3}.b{fill:#c9d1d9}.m,.k{fill:#9198a1}.ln{stroke:#8b949e}.ah,.dot{fill:#8b949e}.lane{stroke:#30363d}
.lnok{stroke:#3fb950}.ahok,.dotok{fill:#3fb950}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahok" d="M0,0L10,5L0,10z"/></marker></defs><rect class="bg" width="1000" height="322" rx="12"/><text class="k" x="30" y="28" text-anchor="start">YOUR BRANCH IS SAFE</text><line class="lane" x1="270" y1="82" x2="970" y2="82"/><text class="mono" x="30" y="86" text-anchor="start">your branch</text><line class="lane" x1="270" y1="162" x2="970" y2="162"/><text class="mono" x="30" y="166" text-anchor="start">refs/review-ready/original</text><line class="lane" x1="270" y1="242" x2="970" y2="242"/><text class="mono" x="30" y="246" text-anchor="start">refs/review-ready/series</text><circle class="dot" cx="300" cy="82" r="8"/><text class="m" x="300" y="66" text-anchor="middle">where you started</text><text class="m" x="510" y="66" text-anchor="middle">untouched while the pass runs</text><path class="ln dash" d="M306,89 L352,153" marker-end="url(#a)"/><circle class="dot" cx="360" cy="162" r="8"/><text class="m" x="370" y="188" text-anchor="start">a copy, saved first</text><circle class="dot" cx="470" cy="242" r="7"/><circle class="dot" cx="540" cy="242" r="7"/><circle class="dot" cx="610" cy="242" r="7"/><path class="ln" d="M478,242 H532" marker-end="url(#a)"/><path class="ln" d="M548,242 H602" marker-end="url(#a)"/><text class="m" x="540" y="270" text-anchor="middle">built in a private worktree, gated, reviewed</text><path class="lnok" d="M616,236 L742,92" marker-end="url(#g)"/><text class="b" x="668" y="206" text-anchor="start">--land, after the ACK</text><circle class="dotok" cx="750" cy="82" r="9"/><text class="m" x="750" y="64" text-anchor="middle">now the series</text><path class="ln dash" d="M890,154 V94" marker-end="url(#a)"/><circle class="dot" cx="890" cy="162" r="7"/><text class="b" x="878" y="116" text-anchor="end">undo: one command,</text><text class="b" x="878" y="133" text-anchor="end">written to UNDO.md</text><text class="m" x="30" y="300" text-anchor="start">Untracked files (.env, data, notes) are never touched. If the session dies half way, you are exactly where you started.</text></svg>
