<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="t d"><title id="t">What one review-ready pass does</title><desc id="d">Your branch is audited and mapped, the problem is stated, the branch is pruned, rewritten and split; the builder's gates and a maintainer review send it back to the rewrite until both pass; then it lands.</desc><style>
.bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.io{fill:#ddf4ff;stroke:#54aeff}.gate{fill:#fff8c5;stroke:#d4a72c}
.ok{fill:#dafbe1;stroke:#4ac26b}.bad{fill:#ffebe9;stroke:#ff8182}.frame{fill:none;stroke:#8c959f;stroke-dasharray:5 4}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}.b{font-size:12px;fill:#424a53}.m{font-size:12px;fill:#59636e}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.k{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#59636e}
.ln{fill:none;stroke:#57606a;stroke-width:1.6}.dash{stroke-dasharray:5 4}.ah{fill:#57606a}.lnok{fill:none;stroke:#2da44e;stroke-width:2.2}.ahok{fill:#2da44e}
.dot{fill:#57606a}.dotok{fill:#2da44e}.lane{stroke:#d0d7de;stroke-width:2}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.io{fill:#0c2d6b;stroke:#1f6feb}
.gate{fill:#3b2300;stroke:#9e6a03}.ok{fill:#04260f;stroke:#2ea043}.bad{fill:#3c1013;stroke:#da3633}.frame{stroke:#6e7681}
text{fill:#e6edf3}.b{fill:#c9d1d9}.m,.k{fill:#9198a1}.ln{stroke:#8b949e}.ah,.dot{fill:#8b949e}.lane{stroke:#30363d}
.lnok{stroke:#3fb950}.ahok,.dotok{fill:#3fb950}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahok" d="M0,0L10,5L0,10z"/></marker></defs><rect class="bg" width="1000" height="410" rx="12"/><text class="k" x="30" y="28" text-anchor="start">ONE PASS, END TO END</text><rect class="io" x="30" y="44" width="164" height="90" rx="10"/><text class="t" x="44" y="70">Your branch</text><text class="b" x="44" y="92">one big commit,</text><text class="b" x="44" y="109">written by an agent</text><rect class="card" x="222" y="44" width="164" height="90" rx="10"/><text class="t" x="236" y="70">1 · Audit and map</text><text class="b" x="236" y="92">risks, copies, callers,</text><text class="b" x="236" y="109">what nothing uses</text><rect class="card" x="414" y="44" width="164" height="90" rx="10"/><text class="t" x="428" y="70">2 · State the problem</text><text class="b" x="428" y="92">one paragraph, checked</text><text class="b" x="428" y="109">against the old code</text><rect class="card" x="606" y="44" width="164" height="90" rx="10"/><text class="t" x="620" y="70">3 · Prune</text><text class="b" x="620" y="92">drop what the problem</text><text class="b" x="620" y="109">does not need, say why</text><text class="k" x="798" y="62" text-anchor="start">TWO WAYS TO RUN</text><text class="b" x="798" y="86" text-anchor="start">Interactive: you adopt or</text><text class="b" x="798" y="103" text-anchor="start">reject every change.</text><text class="b" x="798" y="124" text-anchor="start">Automatic: one message</text><text class="b" x="798" y="141" text-anchor="start">when it is done.</text><path class="ln" d="M196,89.0 H218" marker-end="url(#a)"/><path class="ln" d="M388,89.0 H410" marker-end="url(#a)"/><path class="ln" d="M580,89.0 H602" marker-end="url(#a)"/><path class="ln" d="M688.0,136 V158 H112.0 V232" marker-end="url(#a)"/><rect class="card" x="30" y="236" width="164" height="90" rx="10"/><text class="t" x="44" y="262">4 · Rewrite</text><text class="b" x="44" y="284">shortest code that works,</text><text class="b" x="44" y="301">at most half the lines</text><rect class="card" x="222" y="236" width="164" height="90" rx="10"/><text class="t" x="236" y="262">5 · Split</text><text class="b" x="236" y="284">small bisectable commits,</text><text class="b" x="236" y="301">a real message each</text><rect class="gate" x="414" y="236" width="164" height="90" rx="10"/><text class="t" x="428" y="262">Builder gates</text><text class="b" x="428" y="284">size · reasons</text><text class="b" x="428" y="301">tests · comments</text><rect class="gate" x="606" y="236" width="164" height="90" rx="10"/><text class="t" x="620" y="262">6 · Maintainer review</text><text class="b" x="620" y="284">a hostile stranger walks</text><text class="b" x="620" y="301">the failing case by hand</text><rect class="ok" x="798" y="236" width="164" height="90" rx="10"/><text class="t" x="812" y="262">7 · Land</text><text class="b" x="812" y="284">a short series, an undo,</text><text class="b" x="812" y="301">and a review page</text><path class="ln" d="M196,281.0 H218" marker-end="url(#a)"/><path class="ln" d="M388,281.0 H410" marker-end="url(#a)"/><path class="ln" d="M580,281.0 H602" marker-end="url(#a)"/><path class="ln" d="M772,281.0 H794" marker-end="url(#a)"/><path class="ln dash" d="M496.0,328 V354 H126.0 V330" marker-end="url(#a)"/><text class="m" x="324.0" y="348" text-anchor="middle">a gate fails: rewrite again</text><path class="ln dash" d="M688.0,328 V380 H98.0 V330" marker-end="url(#a)"/><text class="m" x="440.0" y="374" text-anchor="middle">NAK: rewrite again</text><text class="b" x="798" y="356" text-anchor="start">Before: 1 commit, 446 lines</text><text class="b" x="798" y="374" text-anchor="start">After: 2 commits, 40 lines</text></svg>
